name = "rafma-fest"
main = "worker.js"
compatibility_date = "2024-09-23"

# El sitio estático (index.html, styles.css, script.js) se sirve desde public/.
# Las rutas que no coinciden con un archivo ahí caen al Worker de worker.js.
[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "rafma-db"
# ID de la base de datos rafma-db en Cloudflare
database_id = "eb47a39d-97b7-4ac8-b216-747b27e2aac2"
